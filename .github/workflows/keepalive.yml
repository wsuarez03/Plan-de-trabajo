name: Keep Supabase Active

on:
  schedule:
    - cron: '0 12 * * *'  # Una vez al día
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Call Supabase
        run: |
          curl -X GET \
          "${{ secrets.SUPABASE_URL }}/rest/v1/information?limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
